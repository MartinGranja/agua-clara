version: drive-2026-09-21-v3-limpiezas-profundidad
source: Precios_Zonas_AguaClara_v3 (Drive, hojas Precios por tramo y Profundidad y volumen)
approved: false
ranges:
  - [12, 21]
  - [28, 40]
  - [40, 54]
  - [54, 60]
prices:
  mantenimiento: [20000, 24000, 27000, 30000]
  recuperacion: [30000, 36000, 40500, 45000]
  limpieza_total: [140000, 170000, 200000, 230000]
# Cantidad de limpiezas que se informan al cliente. Recuperación: el precio del tramo
# es POR LIMPIEZA y se estiman 2 (pueden hacer falta 3; lo comunica el prestador).
cleanings:
  mantenimiento: 1
  recuperacion: 2
  limpieza_total: 1
# Criterio del comitente: el recargo por profundidad se aplica SOLO a limpieza total. Sin recargo hasta 1,75 m de profundidad promedio; desde ahí, ×1,1 por cada 10 cm completos
# que se pasan de 1,75 m (1,85 m = ×1,1; 1,95 m = ×1,21; 2,05 m = ×1,331).
depth:
  standard_max: 1.75
  step: 0.10
  factor_per_step: 1.1
services:
  mantenimiento: Mantenimiento
  recuperacion: Recuperación
  limpieza_total: Limpieza total
states:
  cristalina: Cristalina
  levemente_turbia: Levemente turbia
  turbia: Turbia
  verde_leve: Verde leve
  verde_intenso: Verde intenso
  verde_oscuro_opaco: Verde oscuro / opaco
  desconocido: No estoy seguro/a
# Formas no rectangulares: la superficie de agua se aproxima como largo × ancho máximos × factor.
# Criterio del comitente: precio por largo × ancho máximos, sin reducir por la forma (factor 1,0). Si algún día se quiere
# reducir la superficie, editar los factores (referencia geométrica: círculo y elipse 0,785; riñón 0,70; L 0,75).
# Estas formas se precotizan igual pero quedan marcadas "a confirmar en la visita".
shapes:
  rectangular: {factor: 1.0, label: Rectangular}
  cuadrada: {factor: 1.0, label: Cuadrada}
  ovalada: {factor: 1.0, label: Ovalada}
  circular: {factor: 1.0, label: Circular}
  rinon: {factor: 1.0, label: Arriñonada}
  en_l: {factor: 1.0, label: "En L"}
  irregular: {factor: 1.0, label: Irregular}
# Error relativo supuesto de la superficie, para mostrar un rango de precio (análisis de sensibilidad).
sensitivity:
  exact: 0.05
  approximate: 0.15
